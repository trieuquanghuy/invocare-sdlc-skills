name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tools/sync/tests -p "test_*.py" -v

      - name: Check shell syntax
        run: |
          while IFS= read -r f; do
            bash -n "$f"
          done < <(find hooks scripts tools/sync -name "*.sh" 2>/dev/null)

      - name: Check whitespace / merge markers
        run: git diff --check
