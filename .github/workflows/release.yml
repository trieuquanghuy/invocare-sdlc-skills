name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "CalVer tag to release (e.g. v2026.08.22)"
        required: true
      ref:
        description: "Git ref to check out and release"
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TAG: ${{ inputs.tag }}
      REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate CalVer tag format and date
        run: |
          bash scripts/validate-calver.sh "$TAG"

      - name: Reject existing remote tag or release
        run: |
          # Capture gh api output + exit status safely under bash -e / pipefail.
          # An expected 404 makes gh api exit nonzero; guard with || to prevent
          # early abort, then inspect the HTTP status line from --include output.
          _check_api() {
            local endpoint="$1"
            local label="$2"
            local api_output api_status http_code
            api_status=0
            api_output=$(gh api \
              -H "Accept: application/vnd.github+json" \
              --silent --include \
              "repos/${GITHUB_REPOSITORY}/${endpoint}" 2>&1) || api_status=$?
            http_code=$(printf '%s\n' "$api_output" \
              | awk '/^HTTP\// { code=$2 } END { print code }')
            if [ -z "$http_code" ]; then
              echo "error: no HTTP status line in API response for ${label}" >&2
              printf '%s\n' "$api_output" >&2
              exit 1
            elif [ "$http_code" = "200" ]; then
              echo "error: ${label} already exists" >&2
              exit 1
            elif [ "$http_code" != "404" ]; then
              echo "error: unexpected API response (HTTP ${http_code}) while checking ${label}" >&2
              printf '%s\n' "$api_output" >&2
              exit 1
            fi
          }
          _check_api "releases/tags/${TAG}" "release '${TAG}'"
          _check_api "git/refs/tags/${TAG}" "git tag '${TAG}'"

      - name: Resolve checked-out HEAD SHA
        run: |
          release_sha="$(git rev-parse HEAD)"
          echo "RELEASE_SHA=${release_sha}" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tools/sync/tests -p "test_*.py" -v

      - name: Check shell syntax
        run: |
          while IFS= read -r f; do
            bash -n "$f"
          done < <(find hooks scripts tools/sync -name "*.sh" 2>/dev/null)

      - name: Check whitespace / merge markers
        run: git diff --check

      - name: Create GitHub release
        run: |
          gh release create "$TAG" --target "$RELEASE_SHA" --generate-notes
